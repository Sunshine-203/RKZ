databases:
  - name: rkz-db
    plan: free
    region: frankfurt
    databaseName: rkz
    user: rkz
    ipAllowList: []

services:
  - type: web
    name: rkz
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: rkz-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-3.7-flash
